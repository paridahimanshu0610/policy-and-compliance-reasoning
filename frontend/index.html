<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compliance Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F4F3EF;
    --surface-line:#E4E1D8;
    --ink:#1B212C;
    --ink-soft:#6B7280;
    --ink-faint:#A2A8B3;
    --gold:#A8802A;
    --gold-soft:#C9A845;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    position:relative;
  }
  header{
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--surface-line);
  }
  header .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    color:var(--ink);
  }
  header a.guidelines-link{
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  header a.guidelines-link:hover{
    color:var(--ink);
    border-color:var(--ink-faint);
  }

  #empty-state{
    position:absolute;
    inset:0;
    top:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  #empty-state p{
    font-family:'Fraunces', serif;
    font-size:24px;
    font-weight:500;
    color:var(--ink-soft);
    max-width:420px;
  }
  #empty-state.hidden{ opacity:0; }

  #transcript{
    flex:1;
    overflow-y:auto;
    padding:24px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .turn{
    display:flex;
    flex-direction:column;
    animation:rise .25s ease-out;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .turn.user{ align-items:flex-end; }
  .turn.assistant{ align-items:flex-start; }

  .bubble{
    max-width:86%;
    line-height:1.55;
    font-size:15px;
    white-space:pre-wrap;
  }
  .turn.user .bubble{
    background:var(--surface);
    border:1px solid var(--surface-line);
    border-radius:14px 14px 3px 14px;
    padding:10px 15px;
    color:var(--ink);
  }
  .turn.assistant .bubble{
    padding:2px 0;
    color:var(--ink);
  }
  .kind-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:5px;
  }

  .citations{
    max-width:86%;
    margin-top:10px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .citation-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--surface-line);
    border-radius:999px;
    padding:5px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .citation-chip .ref{ color:var(--ink); font-weight:500; }
  .citation-chip a{
    color:var(--gold);
    text-decoration:none;
    border-bottom:1px dotted var(--gold);
  }
  .citation-chip a:hover{ color:var(--gold-soft); }

  .conflicts-note{
    max-width:86%;
    margin-top:6px;
    font-size:12px;
    color:#A65A3D;
    font-family:'IBM Plex Mono', monospace;
  }

  .thinking{
    display:flex;
    align-items:baseline;
    gap:2px;
    font-size:15px;
    color:var(--ink-soft);
  }
  .thinking .thinking-word{ font-style:italic; }
  .thinking .dots{ display:inline-flex; margin-left:2px; }
  .thinking .dots span{
    animation:wave 1.1s ease-in-out infinite;
    display:inline-block;
  }
  .thinking .dots span:nth-child(1){ animation-delay:0s; }
  .thinking .dots span:nth-child(2){ animation-delay:.15s; }
  .thinking .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes wave{
    0%, 60%, 100%{ transform:translateY(0); opacity:.45; }
    30%{ transform:translateY(-4px); opacity:1; }
  }

  form{
    display:flex;
    gap:10px;
    padding:16px 20px 22px;
    border-top:1px solid var(--surface-line);
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--surface);
    border:1px solid var(--surface-line);
    color:var(--ink);
    border-radius:10px;
    padding:12px 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    line-height:1.4;
    height:48px;
  }
  textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  button{
    background:var(--ink);
    color:#FFFFFF;
    border:none;
    border-radius:10px;
    padding:0 20px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button:disabled{
    background:var(--surface-line);
    color:var(--ink-faint);
    cursor:not-allowed;
  }
  button:focus-visible, textarea:focus-visible{ outline:2px solid var(--gold); }

  .status-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:#A65A3D;
    padding:0 20px 10px;
  }

  @media (prefers-reduced-motion: reduce){
    .turn{ animation:none; }
    .thinking .dots span{ animation:none; opacity:1; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">Compliance Assistant</span>
    <a class="guidelines-link" href="guidelines.html">Guidelines</a>
  </header>

  <div id="empty-state"><p id="greeting-text">Hello, I'm here to assist you.</p></div>

  <div id="transcript" aria-live="polite"></div>
  <div class="status-line" id="status-line"></div>

  <form id="chat-form">
    <textarea id="message-input" placeholder="Ask about a FINRA rule, a scenario, or a compliance question…" required></textarea>
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
const API_BASE = window.API_BASE || "http://localhost:8000";

const transcriptEl = document.getElementById("transcript");
const emptyStateEl = document.getElementById("empty-state");
const greetingTextEl = document.getElementById("greeting-text");
const formEl = document.getElementById("chat-form");
const inputEl = document.getElementById("message-input");
const sendBtn = document.getElementById("send-btn");
const statusEl = document.getElementById("status-line");

let threadId = null;
let thinkingWords = ["Thinking"];
let thinkingIntervalMs = 1400;

async function initSession() {
  try {
    const [sessionRes, configRes] = await Promise.all([
      fetch(`${API_BASE}/api/session`, { method: "POST" }),
      fetch(`${API_BASE}/api/ui-config`),
    ]);
    if (!sessionRes.ok || !configRes.ok) throw new Error("bad response");

    const session = await sessionRes.json();
    threadId = session.thread_id;

    const config = await configRes.json();
    greetingTextEl.textContent = config.greeting_message;
    if (config.thinking_words && config.thinking_words.length) {
      thinkingWords = config.thinking_words;
    }
    if (config.thinking_word_interval_ms) {
      thinkingIntervalMs = config.thinking_word_interval_ms;
    }
  } catch (err) {
    statusEl.textContent = "Could not reach the API — check that api/main.py is running.";
  }
}

function addTurn(role, kindLabel, text) {
  const turn = document.createElement("div");
  turn.className = `turn ${role}`;
  const tag = document.createElement("div");
  tag.className = "kind-tag";
  tag.textContent = kindLabel;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  turn.appendChild(tag);
  turn.appendChild(bubble);
  transcriptEl.appendChild(turn);
  return turn;
}

function addCitations(turnEl, trace, conflicts) {
  if (trace && trace.length) {
    const wrap = document.createElement("div");
    wrap.className = "citations";
    trace.forEach((c) => {
      const chip = document.createElement("span");
      chip.className = "citation-chip";

      const ref = document.createElement("span");
      ref.className = "ref";
      ref.textContent = c.clause_ref;
      chip.appendChild(ref);

      if (c.rule_url) {
        const link = document.createElement("a");
        link.href = c.rule_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "view rule ↗";
        chip.appendChild(link);
      }
      wrap.appendChild(chip);
    });
    turnEl.appendChild(wrap);
  }

  if (conflicts && conflicts.length) {
    const note = document.createElement("div");
    note.className = "conflicts-note";
    note.textContent = `⚠ ${conflicts.length} potential conflict(s) flagged among cited clauses.`;
    turnEl.appendChild(note);
  }
}

let thinkingTimer = null;

function startThinkingIndicator() {
  const turn = document.createElement("div");
  turn.className = "turn assistant";
  turn.id = "thinking-turn";

  const bubble = document.createElement("div");
  bubble.className = "bubble thinking";

  const wordEl = document.createElement("span");
  wordEl.className = "thinking-word";

  const dots = document.createElement("span");
  dots.className = "dots";
  dots.innerHTML = "<span>.</span><span>.</span><span>.</span>";

  bubble.appendChild(wordEl);
  bubble.appendChild(dots);
  turn.appendChild(bubble);
  transcriptEl.appendChild(turn);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;

  let i = Math.floor(Math.random() * thinkingWords.length);
  wordEl.textContent = thinkingWords[i];
  thinkingTimer = setInterval(() => {
    i = (i + 1) % thinkingWords.length;
    wordEl.textContent = thinkingWords[i];
  }, thinkingIntervalMs);
}

function stopThinkingIndicator() {
  if (thinkingTimer) clearInterval(thinkingTimer);
  thinkingTimer = null;
  const turn = document.getElementById("thinking-turn");
  if (turn) turn.remove();
}

const KIND_LABELS = {
  answer: "Answer",
  clarification: "Clarifying question",
  explanation: "Explanation",
  human_handoff_prompt: "Human handoff",
};

async function sendMessage(message) {
  emptyStateEl.classList.add("hidden");

  addTurn("user", "You", message);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;

  sendBtn.disabled = true;
  statusEl.textContent = "";
  startThinkingIndicator();

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, thread_id: threadId }),
    });
    if (!res.ok) throw new Error(`status ${res.status}`);
    const data = await res.json();

    threadId = data.thread_id;

    stopThinkingIndicator();
    const turnEl = addTurn("assistant", KIND_LABELS[data.type] || data.type, data.content);
    if (data.type === "answer") {
      addCitations(turnEl, data.trace, data.conflicts);
    }
  } catch (err) {
    stopThinkingIndicator();
    statusEl.textContent = "The assistant didn't respond — check that api/main.py is running and reachable.";
  } finally {
    sendBtn.disabled = false;
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }
}

formEl.addEventListener("submit", (e) => {
  e.preventDefault();
  const message = inputEl.value.trim();
  if (!message) return;
  inputEl.value = "";
  sendMessage(message);
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    formEl.requestSubmit();
  }
});

initSession();
</script>
</body>
</html>
