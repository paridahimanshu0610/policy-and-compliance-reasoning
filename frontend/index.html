<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compliance Assistant — Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#10141B;
    --ink-800:#1B212C;
    --ink-700:#262E3B;
    --ink-line:#38414F;
    --paper:#ECE7DB;
    --paper-line:#D8D2C1;
    --gold:#B08D2B;
    --gold-soft:#C9A845;
    --text-hi:#F3F1EA;
    --text-lo:#9AA3B2;
    --ink-on-paper:#20242A;
    --role-primary:#B08D2B;
    --role-supporting:#4F7A63;
    --role-conflict:#A65A3D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink-950);
    color:var(--text-hi);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--ink-line);
  }
  header .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text-lo);
    display:flex;
    justify-content:space-between;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:8px 0 0;
  }
  #thread-id{
    color:var(--gold-soft);
  }

  #transcript{
    flex:1;
    overflow-y:auto;
    padding:24px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .turn{
    display:flex;
    flex-direction:column;
    animation:rise .25s ease-out;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }

  .turn.user{ align-items:flex-end; }
  .turn.assistant{ align-items:flex-start; }

  .bubble{
    max-width:86%;
    padding:12px 16px;
    line-height:1.5;
    font-size:15px;
    white-space:pre-wrap;
  }
  .turn.user .bubble{
    background:var(--ink-700);
    border:1px solid var(--ink-line);
    border-radius:10px 10px 2px 10px;
    color:var(--text-hi);
  }
  .turn.assistant .bubble{
    background:var(--paper);
    color:var(--ink-on-paper);
    border-radius:10px 10px 10px 2px;
    position:relative;
  }
  .turn.assistant .bubble::before{
    content:"";
    position:absolute;
    left:-9px;
    top:0;
    bottom:0;
    width:3px;
    background:var(--gold);
    border-radius:2px;
  }
  .kind-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-lo);
    margin-bottom:6px;
  }
  .turn.assistant .kind-tag{ color:#8b8570; }

  /* citation ledger */
  .ledger{
    max-width:86%;
    margin-top:8px;
    border-left:2px solid var(--ink-line);
    padding-left:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .citation{
    background:var(--ink-800);
    border:1px solid var(--ink-line);
    border-radius:6px;
    padding:8px 10px;
  }
  .citation summary{
    cursor:pointer;
    list-style:none;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
  }
  .citation summary::-webkit-details-marker{ display:none; }
  .citation summary::before{
    content:"›";
    color:var(--text-lo);
    transition:transform .15s ease;
  }
  .citation[open] summary::before{ transform:rotate(90deg); }
  .citation .clause-ref{ color:var(--gold-soft); font-weight:500; }
  .role-dot{
    width:7px; height:7px; border-radius:50%;
    display:inline-block;
    flex-shrink:0;
  }
  .role-primary{ background:var(--role-primary); }
  .role-supporting{ background:var(--role-supporting); }
  .role-conflict{ background:var(--role-conflict); }
  .citation a{
    margin-left:auto;
    color:var(--text-lo);
    font-size:11px;
    text-decoration:none;
    border-bottom:1px dotted var(--text-lo);
  }
  .citation a:hover{ color:var(--gold-soft); border-color:var(--gold-soft); }
  .citation .reasoning{
    margin:8px 0 0;
    padding-top:8px;
    border-top:1px dashed var(--ink-line);
    font-size:13px;
    color:var(--text-lo);
    line-height:1.5;
  }

  .conflicts-note{
    max-width:86%;
    margin-top:6px;
    font-size:12px;
    color:var(--role-conflict);
    font-family:'IBM Plex Mono', monospace;
  }

  form{
    display:flex;
    gap:10px;
    padding:16px 20px 22px;
    border-top:1px solid var(--ink-line);
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--ink-800);
    border:1px solid var(--ink-line);
    color:var(--text-hi);
    border-radius:8px;
    padding:12px 14px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    line-height:1.4;
    height:48px;
  }
  textarea:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  button{
    background:var(--gold);
    color:#1B1607;
    border:none;
    border-radius:8px;
    padding:0 20px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button:disabled{
    background:var(--ink-700);
    color:var(--text-lo);
    cursor:not-allowed;
  }
  button:focus-visible, textarea:focus-visible{ outline:2px solid var(--gold); }

  .status-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-lo);
    padding:0 20px 10px;
  }

  @media (prefers-reduced-motion: reduce){
    .turn{ animation:none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">
      <span>Compliance Assistant</span>
      <span>Docket <span id="thread-id">—</span></span>
    </div>
    <h1>FINRA Rule Inquiry</h1>
  </header>

  <div id="transcript" aria-live="polite"></div>
  <div class="status-line" id="status-line"></div>

  <form id="chat-form">
    <textarea id="message-input" placeholder="Ask about a FINRA rule, a scenario, or a compliance question…" required></textarea>
    <button type="submit" id="send-btn">Send</button>
  </form>
</div>

<script>
// Point this at wherever api/main.py is running.
const API_BASE = window.API_BASE || "http://localhost:8000";

const transcriptEl = document.getElementById("transcript");
const formEl = document.getElementById("chat-form");
const inputEl = document.getElementById("message-input");
const sendBtn = document.getElementById("send-btn");
const statusEl = document.getElementById("status-line");
const threadIdEl = document.getElementById("thread-id");

let threadId = null;

const ROLE_CLASS = {
  primary: "role-primary",
  supporting: "role-supporting",
  conflict: "role-conflict",
  conflicting: "role-conflict",
};

async function initSession() {
  try {
    const res = await fetch(`${API_BASE}/api/session`, { method: "POST" });
    if (!res.ok) throw new Error(`status ${res.status}`);
    const data = await res.json();
    threadId = data.thread_id;
    threadIdEl.textContent = threadId.slice(0, 8);
  } catch (err) {
    statusEl.textContent = "Could not reach the API to start a session — check that api/main.py is running.";
  }
}

function addTurn(role, kindLabel, text) {
  const turn = document.createElement("div");
  turn.className = `turn ${role}`;
  const tag = document.createElement("div");
  tag.className = "kind-tag";
  tag.textContent = kindLabel;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  turn.appendChild(tag);
  turn.appendChild(bubble);
  transcriptEl.appendChild(turn);
  return turn;
}

function addLedger(turnEl, trace, conflicts) {
  if (trace && trace.length) {
    const ledger = document.createElement("div");
    ledger.className = "ledger";
    trace.forEach((c) => {
      const details = document.createElement("details");
      details.className = "citation";
      const summary = document.createElement("summary");

      const dot = document.createElement("span");
      dot.className = `role-dot ${ROLE_CLASS[(c.relevance_role || "").toLowerCase()] || ""}`;
      summary.appendChild(dot);

      const ref = document.createElement("span");
      ref.className = "clause-ref";
      ref.textContent = c.clause_ref;
      summary.appendChild(ref);

      if (c.relevance_role) {
        const roleText = document.createElement("span");
        roleText.textContent = c.relevance_role;
        roleText.style.color = "var(--text-lo)";
        summary.appendChild(roleText);
      }

      if (c.rule_url) {
        const link = document.createElement("a");
        link.href = c.rule_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "view rule ↗";
        link.addEventListener("click", (e) => e.stopPropagation());
        summary.appendChild(link);
      }

      details.appendChild(summary);

      if (c.reasoning) {
        const reasoning = document.createElement("p");
        reasoning.className = "reasoning";
        reasoning.textContent = c.reasoning;
        details.appendChild(reasoning);
      }

      ledger.appendChild(details);
    });
    turnEl.appendChild(ledger);
  }

  if (conflicts && conflicts.length) {
    const note = document.createElement("div");
    note.className = "conflicts-note";
    note.textContent = `⚠ ${conflicts.length} potential conflict(s) flagged among cited clauses.`;
    turnEl.appendChild(note);
  }
}

const KIND_LABELS = {
  answer: "Answer",
  clarification: "Clarifying question",
  explanation: "Explanation",
  human_handoff_prompt: "Human handoff",
};

async function sendMessage(message) {
  addTurn("user", "You", message);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;

  sendBtn.disabled = true;
  statusEl.textContent = "Thinking…";

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, thread_id: threadId }),
    });
    if (!res.ok) throw new Error(`status ${res.status}`);
    const data = await res.json();

    threadId = data.thread_id;
    threadIdEl.textContent = threadId.slice(0, 8);

    const turnEl = addTurn("assistant", KIND_LABELS[data.type] || data.type, data.content);
    if (data.type === "answer") {
      addLedger(turnEl, data.trace, data.conflicts);
    }
    statusEl.textContent = "";
  } catch (err) {
    statusEl.textContent = "The assistant didn't respond — check that api/main.py is running and reachable.";
  } finally {
    sendBtn.disabled = false;
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }
}

formEl.addEventListener("submit", (e) => {
  e.preventDefault();
  const message = inputEl.value.trim();
  if (!message) return;
  inputEl.value = "";
  sendMessage(message);
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    formEl.requestSubmit();
  }
});

initSession();
</script>
</body>
</html>
